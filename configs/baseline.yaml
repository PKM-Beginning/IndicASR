# Baseline evaluation config — Phase 3/4
# Edit these values to scale the experiment up or down; every script in
# src/ and experiments/ reads its settings from a config file like this one,
# nothing is hardcoded.

experiment_name: baseline_whisper_medium

model:
  name: openai/whisper-medium
  # alternative for a smaller/faster smoke test: openai/whisper-small
  device: cuda   # falls back to cpu automatically if no GPU is available
  language_mode: per_language   # pass the correct forced language token per clip

data:
  languages: [hi, bn, te, or]   # Hindi, Bengali, Telugu, Odia (ISO 639-1; Odia = 'or')
  datasets:
    - name: kathbath
      hf_path: ai4bharat/Kathbath
      split: valid
    - name: fleurs
      hf_path: google/fleurs
      split: test
      lang_config_map:
        hi: hi_in
        bn: bn_in
        te: te_in
        or: or_in

  max_eval_samples: 500      # per language, per dataset — raise once the
                              # small run is verified to work end-to-end
  max_train_samples: 200     # used later in finetune.yaml, kept here for reference
  sample_rate: 16000

evaluation:
  metrics: [wer, cer]
  text_normalization: whisper_basic   # normalize before scoring (case, punctuation)
  save_predictions: true
  predictions_path: results/metrics/baseline_predictions.csv

reproducibility:
  seed: 42
